name: Generate Contribution Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    name: Generate and publish contribution snake
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate light and dark blue snakes
        uses: Platane/snk@v3
        with:
          github_user_name: bitgamer2026-a11y
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2338BDF8&color_dots=%23E0F2FE,%23ADD8E6,%2387CEEB,%2338BDF8,%232563EB
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2338BDF8

      - name: Publish snake SVG files
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
